                v -> showHome()
        ));

        LinearLayout card = card();

        TextView title = text(
                "Hörtraining A1",
                25,
                WHITE,
                true
        );
        card.addView(title);

        TextView sentence = text(
                "Guten Morgen! Wie geht es dir?",
                23,
                GOLD,
                true
        );
        sentence.setPadding(0, 25, 0, 15);
        card.addView(sentence);

        TextView translation = text(
                "صباح الخير! كيف حالك؟",
                20,
                BLUE,
                true
        );
        card.addView(translation);

        Button listen = button("🔊  Anhören");
        listen.setOnClickListener(v ->
                speakWord("Guten Morgen! Wie geht es dir?")
        );

        card.addView(listen);

        root.addView(card);

        LinearLayout card2 = card();

        TextView ex = text(
                "Weitere Übung",
                22,
                WHITE,
                true
        );
        card2.addView(ex);

        TextView exText = text(
                "Ich heiße Anna und ich komme aus Deutschland.",
                20,
                GRAY,
                false
        );
        exText.setPadding(0, 15, 0, 15);
        card2.addView(exText);

        Button listen2 = button("🔊  Anhören");
        listen2.setOnClickListener(v ->
                speakWord(
                        "Ich heiße Anna und ich komme aus Deutschland."
                )
        );

        card2.addView(listen2);
        root.addView(card2);

        setContentView(scroll(root));
