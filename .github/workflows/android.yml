name: Deutsch A1 Premium - Full App

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Deutsch A1 Premium
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. GitHub
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # =========================================================
      # 3. Gradle 8.9
      # =========================================================
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # =========================================================
      # 4. Create Android project
      # =========================================================
      - name: Create project
        shell: bash
        run: |

          rm -rf DeutschA1Premium

          mkdir -p DeutschA1Premium
          mkdir -p DeutschA1Premium/app/src/main/java/com/deutscha1/premium
          mkdir -p DeutschA1Premium/app/src/main/res/drawable
          mkdir -p DeutschA1Premium/app/src/main/res/mipmap-hdpi
          mkdir -p DeutschA1Premium/app/src/main/res/mipmap-mdpi
          mkdir -p DeutschA1Premium/app/src/main/res/mipmap-xhdpi
          mkdir -p DeutschA1Premium/app/src/main/res/mipmap-xxhdpi
          mkdir -p DeutschA1Premium/app/src/main/res/mipmap-xxxhdpi
          mkdir -p DeutschA1Premium/app/src/main/assets

          cd DeutschA1Premium

          # -----------------------------------------------------
          # settings.gradle
          # -----------------------------------------------------

          cat > settings.gradle <<'EOF'
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)

    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "DeutschA1Premium"
include(":app")
EOF

          # -----------------------------------------------------
          # root build.gradle
          # -----------------------------------------------------

          cat > build.gradle <<'EOF'
plugins {
    id 'com.android.application' version '8.7.0' apply false
}
EOF

          # -----------------------------------------------------
          # gradle.properties
          # -----------------------------------------------------

          cat > gradle.properties <<'EOF'
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
EOF

          # -----------------------------------------------------
          # app/build.gradle
          # -----------------------------------------------------

          cat > app/build.gradle <<'EOF'
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.deutscha1.premium'
    compileSdk 35

    defaultConfig {
        applicationId 'com.deutscha1.premium'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }

        release {
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.15.0'
}
EOF

          # -----------------------------------------------------
          # AndroidManifest.xml
          # -----------------------------------------------------

          cat > app/src/main/AndroidManifest.xml <<'EOF'
<manifest xmlns:android="http://schemas.android.com/apk/res/android">

    <application
        android:allowBackup="true"
        android:label="Deutsch A1 Premium"
        android:supportsRtl="true"
        android:theme="@style/AppTheme"
        android:usesCleartextTraffic="false">

        <activity
            android:name=".MainActivity"
            android:screenOrientation="portrait"
            android:exported="true">

            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>

        </activity>

    </application>

</manifest>
EOF

          mkdir -p app/src/main/res/values

          # -----------------------------------------------------
          # styles.xml
          # -----------------------------------------------------

          cat > app/src/main/res/values/styles.xml <<'EOF'
<resources>

    <style name="AppTheme"
        parent="Theme.AppCompat.NoActionBar">

        <item name="android:fontFamily">sans</item>
        <item name="android:windowLightStatusBar">false</item>
        <item name="android:statusBarColor">#10131A</item>
        <item name="android:navigationBarColor">#10131A</item>
        <item name="android:windowActionModeOverlay">true</item>

    </style>

</resources>
EOF

          # =====================================================
          # MainActivity.java
          # =====================================================

          cat > app/src/main/java/com/deutscha1/premium/MainActivity.java <<'EOF'
