name: Deutsch A1 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        shell: bash
        run: |
          set -e

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"

          SDKMANAGER="$(command -v sdkmanager || true)"

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "Android SDK manager not found"
            exit 1
          fi

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Extract Android project
        shell: bash
        run: |
          set -e

          ZIP_FILE="$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)"

          if [ -z "$ZIP_FILE" ]; then
            echo "Android project ZIP not found"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          rm -rf DeutschA1Build
          mkdir -p DeutschA1Build

          unzip -q "$ZIP_FILE" -d DeutschA1Build/extracted

          PROJECT_DIR="$(find DeutschA1Build/extracted \
            -type f \
            -name settings.gradle \
            -printf '%h\n' | head -n 1)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "settings.gradle not found inside ZIP"
            exit 1
          fi

          echo "Project directory: $PROJECT_DIR"

          cp -R "$PROJECT_DIR"/. DeutschA1Build/

          test -f DeutschA1Build/settings.gradle
          test -f DeutschA1Build/build.gradle
          test -d DeutschA1Build/app

      - name: Verify A1 vocabulary
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          import json

          p = "DeutschA1Build/app/src/main/assets/words.json"

          with open(p, encoding="utf-8") as f:
              data = json.load(f)

          assert len(data) == 1000, f"Expected 1000 words, found {len(data)}"

          unique = {
              x["de"].strip().lower()
              for x in data
          }

          assert len(unique) == 1000, "Vocabulary contains duplicate German words"

          print("Verified exactly 1000 unique vocabulary entries")
          PY

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd DeutschA1Build

          gradle clean assembleDebug \
            --no-daemon \
            --stacktrace

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully built"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: DeutschA1-Premium-APK
          path: DeutschA1Build/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
