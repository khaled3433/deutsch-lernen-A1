    // =========================================================
    // WRITING
    // =========================================================

    private void showWriting() {

        LinearLayout root = createRoot();

        root.addView(topBar(
                "✍️ Schreiben",
                v -> showHome()
        ));

        addWritingExercise(
                root,
                "Aufgabe 1",
                "Schreibe deinen Namen.",
                "Ich heiße ________."
        );

        addWritingExercise(
                root,
                "Aufgabe 2",
                "Schreibe, wo du wohnst.",
                "Ich wohne in ________."
        );

        addWritingExercise(
                root,
                "Aufgabe 3",
                "Schreibe, woher du kommst.",
                "Ich komme aus ________."
        );

        addWritingExercise(
                root,
                "Aufgabe 4",
                "Schreibe deinen Beruf.",
                "Ich bin ________."
        );

        setContentView(scroll(root));
    }

    // =========================================================
    // DAILY EXERCISE
    // =========================================================

    private void dailyExercise() {

        if (hearts <= 0) {
            Toast.makeText(
                    this,
                    "Keine Herzen mehr ❤️",
                    Toast.LENGTH_LONG
            ).show();
            return;
        }

        hearts--;

        xp += 20;

        if (xp > 100) {
            xp = 100;
        }

        updateHearts();

        Toast.makeText(
                this,
                "✓ Übung abgeschlossen! +20 XP",
                Toast.LENGTH_LONG
        ).show();
    }

    // =========================================================
    // UI HELPERS
    // =========================================================

    private LinearLayout createRoot() {

        LinearLayout root = new LinearLayout(this);
        root.setOrientation(LinearLayout.VERTICAL);
        root.setPadding(18, 12, 18, 25);
        root.setBackgroundColor(BG);

        return root;
    }

    private ScrollView scroll(View view) {

        ScrollView scroll = new ScrollView(this);
        scroll.setFillViewport(true);
        scroll.setBackgroundColor(BG);
        scroll.addView(view);

        return scroll;
    }

    private LinearLayout card() {

        LinearLayout box = new LinearLayout(this);
        box.setOrientation(LinearLayout.VERTICAL);
        box.setPadding(20, 20, 20, 20);
        box.setBackgroundColor(CARD);

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(
                        -1,
                        LinearLayout.LayoutParams.WRAP_CONTENT
                );

        params.setMargins(0, 10, 0, 10);

        box.setLayoutParams(params);

        return box;
    }

    private TextView text(
            String value,
            float size,
            int color,
            boolean bold
    ) {

        TextView t = new TextView(this);

        t.setText(value);
        t.setTextSize(size);
        t.setTextColor(color);
        t.setPadding(4, 5, 4, 5);

        if (bold) {
            t.setTypeface(Typeface.DEFAULT, Typeface.BOLD);
        }

        return t;
    }

    private Button button(String value) {

        Button b = new Button(this);

        b.setText(value);
        b.setTextSize(16);
        b.setTextColor(WHITE);
        b.setAllCaps(false);
        b.setPadding(15, 12, 15, 12);

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(-1, -2);

        params.setMargins(0, 8, 0, 8);

        b.setLayoutParams(params);

        return b;
    }

    private LinearLayout sectionButton(
            String title,
            String subtitle,
            View.OnClickListener listener
    ) {

        LinearLayout box = card();

        box.setBackgroundColor(CARD2);

        TextView t = text(
                title,
                21,
                WHITE,
                true
        );

        TextView s = text(
                subtitle,
                14,
                GRAY,
                false
        );

        box.addView(t);
        box.addView(s);

        box.setOnClickListener(listener);

        return box;
    }

    private LinearLayout topBar(
            String title,
            View.OnClickListener back
    ) {

        LinearLayout bar = new LinearLayout(this);
        bar.setOrientation(LinearLayout.HORIZONTAL);
        bar.setGravity(Gravity.CENTER_VERTICAL);
        bar.setPadding(0, 5, 0, 15);

        Button backButton = new Button(this);
        backButton.setText("←");
        backButton.setTextSize(25);
        backButton.setTextColor(WHITE);
        backButton.setAllCaps(false);
        backButton.setOnClickListener(back);

        bar.addView(backButton);

        TextView titleView = text(
                title,
                25,
                WHITE,
                true
        );

        LinearLayout.LayoutParams params =
                new LinearLayout.LayoutParams(0, -2, 1);

        titleView.setGravity(Gravity.CENTER);

        bar.addView(titleView, params);

        return bar;
    }

    private void addGrammarCard(
            LinearLayout root,
            String title,
            String content
    ) {

        LinearLayout box = card();

        box.addView(
                text(
                        title,
                        21,
                        GOLD,
                        true
                )
        );

        box.addView(
                text(
                        content,
                        17,
                        WHITE,
                        false
                )
        );

        root.addView(box);
    }

    private void addWritingExercise(
            LinearLayout root,
            String title,
            String question,
            String example
    ) {

        LinearLayout box = card();

        box.addView(
                text(
                        title,
                        20,
                        GOLD,
                        true
                )
        );

        box.addView(
                text(
                        question,
                        18,
                        WHITE,
                        true
                )
        );

        box.addView(
                text(
                        example,
                        17,
                        GRAY,
                        false
                )
        );

        Button done = button("✓  Aufgabe erledigt");

        done.setOnClickListener(v -> {
            xp += 10;

            if (xp > 100) {
                xp = 100;
            }

            Toast.makeText(
                    this,
                    "+10 XP ⭐",
                    Toast.LENGTH_SHORT
            ).show();
        });

        box.addView(done);

        root.addView(box);
    }

    // =========================================================
    // TTS
    // =========================================================

    private void speakWord(String word) {

        if (tts != null) {

            tts.setLanguage(Locale.GERMANY);

            tts.speak(
                    word,
                    TextToSpeech.QUEUE_FLUSH,
                    null,
                    "DEUTSCH_A1"
            );
        }
    }

    // =========================================================
    // HEARTS
    // =========================================================

    private void updateHearts() {

        if (heartsText == null) {
            return;
        }

        StringBuilder result = new StringBuilder();

        for (int i = 0; i < 5; i++) {

            if (i < hearts) {
                result.append("♥ ");
            } else {
                result.append("♡ ");
            }
        }

        heartsText.setText(result.toString());
    }

