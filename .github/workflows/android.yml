                new Word(
                        german,
                        arabic,
                        article
                )
        );
    }

    // =========================================================
    // WORD CLASS
    // =========================================================

    private static class Word {

        String german;
        String arabic;
        String article;

        Word(
                String german,
                String arabic,
                String article
        ) {

            this.german = german;
            this.arabic = arabic;
            this.article = article;
        }
    }

    // =========================================================
    // CLEANUP
    // =========================================================

    @Override
    protected void onDestroy() {

        if (tts != null) {
            tts.stop();
            tts.shutdown();
        }

        super.onDestroy();
    }
}
