name: Deutsch A1 Premium - Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل ملفات المشروع من GitHub
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.9
      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # 4. البحث عن ملف ZIP
      - name: Find project ZIP
        run: |
          echo "Searching for Android project ZIP..."

          ZIP_FILE=$(find . -maxdepth 2 -type f \
            \( -iname "*.zip" \) \
            | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "ZIP found:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      # 5. فك المشروع
      - name: Extract Android project
        run: |
          rm -rf AndroidProject
          mkdir -p AndroidProject

          unzip -q "$ZIP_FILE" -d AndroidProject

          echo "Extracted files:"
          find AndroidProject -maxdepth 4 -type f | head -100

      # 6. العثور على مجلد مشروع Android الحقيقي
      - name: Locate Android project
        run: |
          SETTINGS=$(find AndroidProject \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "The ZIP does not contain a valid Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      # 7. التأكد من وجود التطبيق
      - name: Verify Android project
        run: |
          echo "Project directory:"
          ls -la "$PROJECT_DIR"

          echo ""
          echo "Searching for app module..."

          find "$PROJECT_DIR" \
            -maxdepth 4 \
            -type f \
            \( -name "build.gradle" -o -name "build.gradle.kts" \) \
            -print

          if [ ! -d "$PROJECT_DIR/app" ]; then
            echo "ERROR: app module not found."
            exit 1
          fi

      # 8. التأكد من الكلمات
      - name: Check vocabulary
        run: |
          echo "Searching for words.json..."

          WORDS=$(find "$PROJECT_DIR/app/src/main" \
            -type f \
            -name "words.json" \
            | head -n 1 || true)

          if [ -n "$WORDS" ]; then
            echo "Vocabulary file found:"
            echo "$WORDS"

            echo ""
            echo "Vocabulary size:"
            grep -o '"german"' "$WORDS" | wc -l || true
          else
            echo "WARNING: words.json was not found."
            echo "The application will be built using the files included in the project."
          fi

      # 9. صلاحيات Gradle
      - name: Prepare Gradle
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            echo "Using project Gradle wrapper."
          else
            echo "No Gradle wrapper found."
            echo "Using installed Gradle 8.9."
          fi

      # 10. بناء APK
      - name: Build Debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      # 11. العثور على APK
      - name: Locate APK
        run: |
          echo "Searching for generated APK..."

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          APK=$(find "$PROJECT_DIR" \
            -type f \
            -path "*/outputs/apk/debug/*.apk" \
            | head -n 1)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          echo ""
          echo "APK found:"
          echo "$APK"

          echo ""
          echo "APK size:"
          ls -lh "$APK"

          echo "APK=$APK" >> "$GITHUB_ENV"

      # 12. رفع APK كـ Artifact
      - name: Upload Deutsch A1 Premium APK
        uses: actions/upload-artifact@v4
        with:
          name: Deutsch-A1-Premium-APK
          path: ${{ env.APK }}
          if-no-files-found: error
          retention-days: 7

      # 13. إظهار نجاح البناء
      - name: Build completed
        run: |
          echo "======================================"
          echo "Deutsch A1 Premium APK BUILD SUCCESS"
          echo "======================================"
          echo "APK:"
          echo "$APK"
          echo ""
          echo "The APK is available in the workflow Artifacts."
