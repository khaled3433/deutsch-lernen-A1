    private final int GRAY = Color.rgb(185, 185, 195);
    private final int GOLD = Color.rgb(255, 210, 70);
    private final int GREEN = Color.rgb(80, 210, 140);
    private final int RED = Color.rgb(240, 80, 90);
    private final int BLUE = Color.rgb(90, 160, 255);

    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);

        createVocabulary();

        tts = new TextToSpeech(this, status -> {
            if (status == TextToSpeech.SUCCESS) {
                tts.setLanguage(Locale.GERMANY);
            }
        });

        showHome();
    }

    // =========================================================
    // HOME
    // =========================================================

    private void showHome() {

        LinearLayout root = createRoot();

        // Header
        LinearLayout header = new LinearLayout(this);
        header.setOrientation(LinearLayout.HORIZONTAL);
        header.setGravity(Gravity.CENTER_VERTICAL);
        header.setPadding(20, 18, 20, 10);

        LinearLayout titleBox = new LinearLayout(this);
        titleBox.setOrientation(LinearLayout.VERTICAL);

        titleText = text("Deutsch A1", 27, WHITE, true);
        TextView premium = text("PREMIUM", 12, GOLD, true);

        titleBox.addView(titleText);
        titleBox.addView(premium);

        LinearLayout.LayoutParams titleParams =
                new LinearLayout.LayoutParams(0, -2, 1);
        header.addView(titleBox, titleParams);

        heartsText = text("♥ ♥ ♥ ♥ ♥", 18, RED, true);
        heartsText.setGravity(Gravity.CENTER);
        header.addView(heartsText);

        root.addView(header);

        // XP card
        LinearLayout progressCard = card();

        TextView level = text("⭐  Level 1", 18, WHITE, true);
        progressCard.addView(level);

        xpText = text("XP  " + xp + " / 100", 15, GOLD, false);
        progressCard.addView(xpText);

        TextView progress = text(
                "Fortschritt: " + xp + "%",
                13,
                GRAY,
                false
        );
        progressCard.addView(progress);

        root.addView(progressCard);

        // Welcome
        TextView welcome = text(
                "Willkommen! 👋\nLerne Deutsch auf A1-Niveau.",
                20,
                WHITE,
                true
        );
        welcome.setPadding(22, 25, 22, 20);
        root.addView(welcome);

        // Sections
        root.addView(sectionButton(
                "📚  Wörter",
                "1000 wichtige A1-Wörter",
                v -> showWords()
        ));

        root.addView(sectionButton(
                "📖  Grammatik",
                "Grundlagen der deutschen Grammatik",
                v -> showGrammar()
        ));

        root.addView(sectionButton(
                "🎧  Hören",
                "Hören und Aussprache trainieren",
                v -> showListening()
        ));

        root.addView(sectionButton(
                "✍️  Schreiben",
                "Schreiben auf A1-Niveau",
                v -> showWriting()
        ));

        // Daily button
        Button daily = button("⭐  TÄGLICHE ÜBUNG");
        daily.setOnClickListener(v -> dailyExercise());
        root.addView(daily);

        setContentView(scroll(root));
    }

    // =========================================================
    // WORDS
    // =========================================================

    private void showWords() {

        LinearLayout root = createRoot();

        root.addView(topBar(
                "📚 Wörter",
                v -> showHome()
        ));

        Word word = words.get(currentWord);

        LinearLayout wordCard = card();
        wordCard.setGravity(Gravity.CENTER);

        TextView counter = text(
                (currentWord + 1) + " / " + words.size(),
                14,
                GRAY,
                false
        );
        wordCard.addView(counter);

        TextView german = text(
                word.german,
                36,
                WHITE,
                true
        );
        german.setGravity(Gravity.CENTER);
        german.setPadding(10, 25, 10, 10);
        wordCard.addView(german);

        TextView article = text(
                word.article,
                18,
                GOLD,
                true
        );
        article.setGravity(Gravity.CENTER);
        wordCard.addView(article);

        TextView arabic = text(
                word.arabic,
                25,
                BLUE,
                true
        );
        arabic.setGravity(Gravity.CENTER);
        arabic.setPadding(10, 20, 10, 25);
        wordCard.addView(arabic);

        root.addView(wordCard);

        Button speak = button("🔊  Aussprache hören");
        speak.setOnClickListener(v -> speakWord(word.german));
        root.addView(speak);

        Button learned = button("✓  Gelernt +10 XP");
        learned.setOnClickListener(v -> {
            xp += 10;

            if (xp > 100) {
                xp = 0;
                Toast.makeText(
                        this,
                        "🎉 Neues Level!",
                        Toast.LENGTH_SHORT
                ).show();
            }

            currentWord++;

            if (currentWord >= words.size()) {
                currentWord = 0;
            }

            showWords();
        });
        root.addView(learned);

        Button previous = button("←  Zurück");
        previous.setOnClickListener(v -> {
            currentWord--;

            if (currentWord < 0) {
                currentWord = words.size() - 1;
            }

            showWords();
        });
        root.addView(previous);

        setContentView(scroll(root));
    }

    // =========================================================
    // GRAMMAR
    // =========================================================

    private void showGrammar() {

        LinearLayout root = createRoot();

        root.addView(topBar(
                "📖 Grammatik",
                v -> showHome()
        ));

        addGrammarCard(
                root,
                "1. Personalpronomen",
                "ich = أنا\n" +
                "du = أنت\n" +
                "er = هو\n" +
                "sie = هي\n" +
                "wir = نحن\n" +
                "ihr = أنتم\n" +
                "Sie = حضرتك / حضراتكم"
        );

        addGrammarCard(
                root,
                "2. Verb sein",
                "ich bin = أنا أكون\n" +
                "du bist = أنت تكون\n" +
                "er ist = هو يكون\n" +
                "sie ist = هي تكون\n" +
                "wir sind = نحن نكون\n" +
                "ihr seid = أنتم تكونون\n" +
                "Sie sind = حضرتك تكون"
        );

        addGrammarCard(
                root,
                "3. Verb haben",
                "ich habe = لدي\n" +
                "du hast = لديك\n" +
                "er hat = لديه\n" +
                "sie hat = لديها\n" +
                "wir haben = لدينا\n" +
                "ihr habt = لديكم\n" +
                "Sie haben = لديكم"
        );

        addGrammarCard(
                root,
                "4. Satzbau",
                "Ich lerne Deutsch.\n" +
                "أنا أتعلم الألمانية.\n\n" +
                "Du wohnst in Berlin.\n" +
                "أنت تسكن في برلين."
        );

        addGrammarCard(
                root,
                "5. Fragen",
                "Wie heißt du?\n" +
                "ما اسمك؟\n\n" +
                "Wo wohnst du?\n" +
                "أين تسكن؟\n\n" +
                "Wie geht es dir?\n" +
                "كيف حالك؟"
        );

        setContentView(scroll(root));
    }

    // =========================================================
    // LISTENING
    // =========================================================

    private void showListening() {

        LinearLayout root = createRoot();

        root.addView(topBar(
